[workspace]
resolver = "2"
members = ["ommatidia", "ommatidia-data", "ommatidia-train"]

[workspace.package]
version = "0.1.0"
authors = ["Dzmitry Malyshau"]
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/kvark/ommatidia"

[workspace.dependencies]
ommatidia = { path = "ommatidia", version = "0.1" }
blade-graphics = { version = "0.9", git = "https://github.com/kvark/blade", rev = "d9112e26ab1244d9e206e7d27387295a28cb3fa3" }
blade-render = { version = "0.6", git = "https://github.com/kvark/blade", rev = "d9112e26ab1244d9e206e7d27387295a28cb3fa3" }
blade-asset = { version = "0.2.2", git = "https://github.com/kvark/blade", rev = "d9112e26ab1244d9e206e7d27387295a28cb3fa3" }
blade-macros = { version = "0.3", git = "https://github.com/kvark/blade", rev = "d9112e26ab1244d9e206e7d27387295a28cb3fa3" }
meganeura = { version = "0.3", git = "https://github.com/kvark/meganeura", rev = "25ed41cc8426e98849ba6366d7da6634b0e2b57d" }
bytemuck = { version = "1", features = ["derive"] }
half = { version = "2", features = ["bytemuck"] }
log = "0.4"
env_logger = "0.11"
mint = "0.5"
choir = "0.7"
png = "0.18"
serde = { version = "1", features = ["derive"] }
ron = "0.8"
serde_json = "1"
naga = { version = "30", git = "https://github.com/kvark/wgpu", rev = "9964733300924e724b6d41ef268e7c2933f3dcdb", features = ["wgsl-in"] }

[patch.crates-io]
blade-macros = { git = "https://github.com/kvark/blade", rev = "d9112e26ab1244d9e206e7d27387295a28cb3fa3" }
