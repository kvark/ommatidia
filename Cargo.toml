[workspace]
resolver = "2"
members = ["ommatidia", "ommatidia-data", "ommatidia-train"]

[workspace.package]
version = "0.1.0"
authors = ["Dzmitry Malyshau"]
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/kvark/ommatidia"

[workspace.dependencies]
ommatidia = { path = "ommatidia", version = "0.1" }
blade-graphics = { version = "0.9", git = "https://github.com/kvark/blade", rev = "fbb4f28c4869e81ae15de58925945b423b9c1ac5" }
blade-render = { version = "0.6", git = "https://github.com/kvark/blade", rev = "fbb4f28c4869e81ae15de58925945b423b9c1ac5" }
blade-asset = { version = "0.2.2", git = "https://github.com/kvark/blade", rev = "fbb4f28c4869e81ae15de58925945b423b9c1ac5" }
blade-macros = { version = "0.3", git = "https://github.com/kvark/blade", rev = "fbb4f28c4869e81ae15de58925945b423b9c1ac5" }
meganeura = { version = "0.3", git = "https://github.com/kvark/meganeura", rev = "ee3aea42da8e3e7b63d4083d0ea35b09848872ad" }
bytemuck = { version = "1", features = ["derive"] }
half = { version = "2", features = ["bytemuck"] }
log = "0.4"
env_logger = "0.11"
mint = "0.5"
choir = "0.7"
png = "0.18"
serde = { version = "1", features = ["derive"] }
ron = "0.8"
serde_json = "1"
naga = { version = "30", git = "https://github.com/gfx-rs/wgpu", rev = "323acfb729a00c3030e362faa27252afe6368792", features = ["wgsl-in"] }

# Blade's sibling checkout overlays its git pins for renderer development.
# Meganeura resolves to its exact upstream pin, without a sibling override.
# Meganeura and blade-render must resolve to the same `blade-graphics` crate or the
# `Context` a host renderer owns is not the type meganeura's session accepts.
[patch."https://github.com/kvark/blade"]
blade-graphics = { path = "../blade/blade-graphics" }
blade-render = { path = "../blade/blade-render" }
blade-asset = { path = "../blade/blade-asset" }
blade-macros = { path = "../blade/blade-macros" }

[patch.crates-io]
blade-macros = { path = "../blade/blade-macros" }
