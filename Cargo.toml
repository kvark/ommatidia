[workspace]
resolver = "2"
members = ["ommatidia", "ommatidia-capi", "ommatidia-data", "ommatidia-train"]

[workspace.package]
version = "0.1.0"
authors = ["Dzmitry Malyshau"]
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/kvark/ommatidia"

[workspace.dependencies]
ommatidia = { path = "ommatidia", version = "0.1" }
blade-graphics = "0.9"
blade-render = "0.6"
blade-helpers = "0.3"
blade-asset = "0.2.2"
meganeura = { path = "../meganeura" }
bytemuck = { version = "1", features = ["derive"] }
half = { version = "2", features = ["bytemuck"] }
log = "0.4"
env_logger = "0.11"
mint = "0.5"
choir = "0.7"
png = "0.18"
serde = { version = "1", features = ["derive"] }
ron = "0.8"
serde_json = "1"
naga = { version = "30", features = ["wgsl-in"] }
