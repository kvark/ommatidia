<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
  <title id="title">Ommatidium spatial and temporal reconstruction architecture</title>
  <desc id="desc">Sparse path samples and a low-resolution G-buffer feed a convolutional reconstructor. Its sub-pixel weights gather current radiance samples, restore exact output-resolution albedo, and produce a two-times output. The temporal GPU path reprojects the previous reconstruction using current-to-previous motion, rejects mismatched output-resolution surfaces, and gates valid history after the spatial gather.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#59636e"/></marker>
    <style>
      .box{fill:#f6f8fa;stroke:#57606a;stroke-width:2;rx:12}.core{fill:#ddf4ff;stroke:#0969da;stroke-width:2;rx:12}
      .line{stroke:#59636e;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#24292f}.h{font-size:18px;font-weight:650}.p{font-size:14px}.tag{font-size:13px;font-weight:650;fill:#0969da}.note{font-size:12px;fill:#57606a}
    </style>
  </defs>

  <text x="35" y="31" class="tag">IMPLEMENTED SPATIAL PATH · 2×</text>
  <rect x="35" y="52" width="175" height="112" class="box"/>
  <text x="123" y="84" text-anchor="middle" class="h">Sparse paths</text>
  <text x="123" y="112" text-anchor="middle" class="p">linear HDR · 1–4 spp</text>
  <text x="123" y="137" text-anchor="middle" class="p">depth · normal · albedo</text>

  <path d="M210 108 H253" class="line"/>
  <rect x="253" y="52" width="150" height="112" class="box"/>
  <text x="328" y="89" text-anchor="middle" class="h">GPU pack</text>
  <text x="328" y="117" text-anchor="middle" class="p">range encode</text>
  <text x="328" y="141" text-anchor="middle" class="p">input resolution</text>

  <path d="M403 108 H446" class="line"/>
  <rect x="446" y="40" width="226" height="136" class="core"/>
  <text x="559" y="76" text-anchor="middle" class="h">Convolutional U-Net</text>
  <text x="559" y="104" text-anchor="middle" class="p">multi-scale · one pass</text>
  <text x="559" y="128" text-anchor="middle" class="p">one convex kernel per</text>
  <text x="559" y="150" text-anchor="middle" class="p">output sub-pixel</text>

  <path d="M672 108 H715" class="line"/>
  <rect x="715" y="40" width="215" height="136" class="core"/>
  <text x="823" y="76" text-anchor="middle" class="h">Current-sample gather</text>
  <text x="823" y="104" text-anchor="middle" class="p">25 or 49 measured taps</text>
  <text x="823" y="128" text-anchor="middle" class="p">exact HR albedo restore</text>
  <text x="823" y="150" text-anchor="middle" class="p">no filtered image between</text>

  <path d="M930 108 H973" class="line"/>
  <rect x="973" y="65" width="112" height="86" class="box"/>
  <text x="1029" y="100" text-anchor="middle" class="h">2× HDR</text>
  <text x="1029" y="127" text-anchor="middle" class="p">output</text>

  <rect x="700" y="203" width="245" height="68" class="box"/>
  <text x="823" y="231" text-anchor="middle" class="h">HR primary surfaces</text>
  <text x="823" y="255" text-anchor="middle" class="p">depth · normal · albedo</text>
  <path d="M823 203 V176" class="line"/>

  <text x="35" y="321" class="tag">IMPLEMENTED TEMPORAL GPU PATH · EXPERIMENTAL CHECKPOINT</text>
  <rect x="35" y="354" width="190" height="104" class="core"/>
  <text x="130" y="387" text-anchor="middle" class="h">Previous 2× output</text>
  <text x="130" y="415" text-anchor="middle" class="p">library-owned ping-pong</text>
  <text x="130" y="439" text-anchor="middle" class="p">compressed radiance</text>

  <path d="M225 406 H275" class="line"/>
  <rect x="275" y="342" width="235" height="128" class="core"/>
  <text x="393" y="375" text-anchor="middle" class="h">Warp + surface reject</text>
  <text x="393" y="403" text-anchor="middle" class="p">current → previous motion</text>
  <text x="393" y="427" text-anchor="middle" class="p">depth · normal · albedo</text>
  <text x="393" y="451" text-anchor="middle" class="p">color + explicit validity</text>

  <path d="M510 406 H570" class="line"/>
  <rect x="570" y="342" width="240" height="128" class="core"/>
  <text x="690" y="375" text-anchor="middle" class="h">Post-gather history mix</text>
  <text x="690" y="403" text-anchor="middle" class="p">one learned gate per sub-pixel</text>
  <text x="690" y="427" text-anchor="middle" class="p">invalid history hard-closes gate</text>
  <text x="690" y="451" text-anchor="middle" class="p">current gather remains fallback</text>

  <path d="M810 406 H1029 V151" class="line"/>
  <path d="M1029 151 V300 H130 V354" class="line"/>
  <path d="M823 271 V300 H393 V342" class="line"/>
  <text x="832" y="493" text-anchor="middle" class="note">Library-owned ping-pong state; reset closes history gates and seeds the next sequence from current samples.</text>
</svg>
