<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="410" viewBox="0 0 1120 410" role="img" aria-labelledby="title desc">
  <title id="title">Ommatidium reconstruction architecture</title>
  <desc id="desc">A low-resolution path traced frame and G-buffer are packed into a low-resolution U-Net, whose sub-pixel residual is unpacked into a two-times larger output. A dashed future temporal path reprojects the previous output with motion and depth.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#59636e"/></marker>
    <style>
      .box{fill:#f6f8fa;stroke:#57606a;stroke-width:2;rx:12}.core{fill:#ddf4ff;stroke:#0969da;stroke-width:2;rx:12}
      .future{fill:#fff8c5;stroke:#9a6700;stroke-width:2;stroke-dasharray:7 5;rx:12}.line{stroke:#59636e;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#9a6700;stroke-width:2.5;stroke-dasharray:7 5;fill:none;marker-end:url(#arrow)}
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#24292f}.h{font-size:19px;font-weight:650}.p{font-size:14px}.tag{font-size:13px;font-weight:600;fill:#0969da}
    </style>
  </defs>
  <text x="40" y="34" class="tag">TODAY · SINGLE FRAME, 2×</text>
  <rect x="40" y="60" width="190" height="112" class="box"/>
  <text x="135" y="91" text-anchor="middle" class="h">Sparse path trace</text>
  <text x="135" y="119" text-anchor="middle" class="p">linear HDR color · 1 spp</text>
  <text x="135" y="143" text-anchor="middle" class="p">depth · normal · materials</text>
  <path d="M230 116 H290" class="line"/>
  <rect x="290" y="60" width="175" height="112" class="box"/>
  <text x="378" y="98" text-anchor="middle" class="h">GPU pack</text>
  <text x="378" y="126" text-anchor="middle" class="p">range encode + NCHW</text>
  <text x="378" y="148" text-anchor="middle" class="p">input resolution</text>
  <path d="M465 116 H525" class="line"/>
  <rect x="525" y="47" width="225" height="138" class="core"/>
  <text x="638" y="83" text-anchor="middle" class="h">Meganeura U-Net</text>
  <text x="638" y="111" text-anchor="middle" class="p">649k parameters · one pass</text>
  <text x="638" y="135" text-anchor="middle" class="p">runs entirely at input size</text>
  <text x="638" y="159" text-anchor="middle" class="p">predicts 3 × scale² residuals</text>
  <path d="M750 116 H810" class="line"/>
  <rect x="810" y="60" width="150" height="112" class="box"/>
  <text x="885" y="98" text-anchor="middle" class="h">GPU unpack</text>
  <text x="885" y="126" text-anchor="middle" class="p">sub-pixel scatter</text>
  <text x="885" y="148" text-anchor="middle" class="p">+ nearest base</text>
  <path d="M960 116 H1010" class="line"/>
  <rect x="1010" y="73" width="80" height="86" class="box"/>
  <text x="1050" y="107" text-anchor="middle" class="h">2×</text>
  <text x="1050" y="132" text-anchor="middle" class="p">HDR out</text>

  <text x="40" y="237" class="tag" style="fill:#9a6700">NEXT · TEMPORAL RECONSTRUCTION</text>
  <rect x="190" y="267" width="210" height="100" class="future"/>
  <text x="295" y="301" text-anchor="middle" class="h">Previous 2× output</text>
  <text x="295" y="329" text-anchor="middle" class="p">double-buffered on device</text>
  <text x="295" y="351" text-anchor="middle" class="p">no host readback</text>
  <path d="M400 317 H500" class="dash"/>
  <rect x="500" y="255" width="275" height="124" class="future"/>
  <text x="638" y="289" text-anchor="middle" class="h">Reproject + validate</text>
  <text x="638" y="317" text-anchor="middle" class="p">motion vectors · depth · normal</text>
  <text x="638" y="341" text-anchor="middle" class="p">history color + confidence</text>
  <text x="638" y="363" text-anchor="middle" class="p">space-to-depth at input size</text>
  <path d="M638 255 V203 H638 V185" class="dash"/>
  <path d="M135 172 V317 H190" class="dash"/>
</svg>
