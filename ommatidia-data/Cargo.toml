bytemuck.workspace = true
choir.workspace = true
env_logger.workspace = true
gltf = { version = "1.4", default-features = false, features = [
    "KHR_materials_emissive_strength",
    "KHR_texture_transform",
] }
half.workspace = true
log.workspace = true
mint.workspace = true
png.workspace = true
serde.workspace = true
serde_json = "1"

[dev-dependencies]
naga = { workspace = true }
