name: reconstruction development
on:
  pull_request:
    paths: ['.github/workflows/reconstruction-dev.yml', '.github/reconstruction-edit.py']
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.number == 18 && github.head_ref == 'reconstruction/candidate-aware-fusion' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ommatidia
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: ommatidia
      - uses: actions/checkout@v4
        with:
          repository: kvark/blade
          ref: b208f3b1f97196c2971436b5726e61e71b149c37
          path: blade
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kvark/meganeura
          ref: 230cab004a898d0494e0a327ef695652a98a10cc
          path: meganeura
          persist-credentials: false
      - name: Setup
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
          sudo apt-get update -qq
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
      - name: Apply source cleanup
        run: |
          if test -f .github/reconstruction-edit.py; then python3 .github/reconstruction-edit.py; fi
          cargo +1.92.0 fmt --all
      - name: Check updated dependencies and all targets
        run: cargo +1.92.0 check --workspace --all-targets
      - name: Commit implementation to this review branch
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/reconstruction/candidate-aware-fusion | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if test -f .github/reconstruction-edit.py; then git rm .github/reconstruction-edit.py; fi
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then git commit -m 'refactor: finish active reconstruction trainer cleanup'; git push origin HEAD:refs/heads/reconstruction/candidate-aware-fusion; fi
      - name: Workspace tests
        run: cargo +1.92.0 test --workspace --locked
      - name: Clippy
        run: cargo +1.92.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: Recurrent transport GPU and training tests
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          OMMATIDIA_REQUIRE_GPU: 1
        run: cargo +1.92.0 test -p ommatidia --test transport --locked -- --ignored --nocapture --test-threads=1
      - name: Render, train and audit held-out sequences on LavaPipe
        run: bash benchmarks/transport-lavapipe.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transport-lavapipe-quality
          path: ommatidia/target/transport-quality
          retention-days: 7
      - name: Archive formatted source
        if: always()
        run: tar --exclude=.git --exclude=target -czf "$RUNNER_TEMP/reconstruction-source.tar.gz" .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reconstruction-source
          path: ${{ runner.temp }}/reconstruction-source.tar.gz
          retention-days: 1
