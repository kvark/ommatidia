name: capture cache regression and corrected transport controls
on:
  pull_request:
    paths: ['.github/workflows/cache-study.yml', '.github/cache-edit.py']
permissions:
  contents: read
  actions: read
jobs:
  capture:
    if: github.event.pull_request.number == 19 && github.head_ref == 'docs/visual-quality-roadmap' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    defaults:
      run:
        shell: bash
        working-directory: ommatidia
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: ommatidia
      - uses: actions/checkout@v4
        with:
          repository: kvark/meganeura
          ref: d903bba0a478277216133719e1eaa31b56d0be10
          path: meganeura
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kvark/blade
          ref: c24621aa6606da968fd1b3967d5993f8aa2b74e8
          path: blade
          persist-credentials: false
      - name: Setup
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
          sudo apt-get update -qq
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
      - name: Reproduce stale inline-texture cache
        env:
          CACHE_RESULTS: target/cache-before
          CACHE_EXPECT: stale
        run: |
          python3 .github/cache-edit.py isolate
          cargo +1.92.0 fmt --all
          bash benchmarks/cache-lavapipe.sh
      - name: Apply content-addressed names and check
        run: |
          python3 .github/cache-edit.py fix
          cargo +1.92.0 fmt --all
          mkdir -p target/cache-validation
          cargo +1.92.0 check --workspace --all-targets --locked 2>&1 | tee target/cache-validation/check.log
          cargo +1.92.0 test --workspace --locked 2>&1 | tee target/cache-validation/unit.log
          cargo +1.92.0 clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee target/cache-validation/clippy.log
      - name: Verify warm/cold equality after the fix
        env:
          CACHE_RESULTS: target/cache-after
        run: bash benchmarks/cache-lavapipe.sh
      - name: Commit tested cache fix
        id: commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/docs/visual-quality-roadmap | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/cache-edit.py
          git add ommatidia-data benchmarks/cache-lavapipe.sh
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git commit -m 'fix: make procedural texture captures independent of warm asset caches'
          git push origin HEAD:refs/heads/docs/visual-quality-roadmap
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: quality-control-data
          run-id: 34152574900
          github-token: ${{ github.token }}
          path: ommatidia/target/prior-data
      - name: Reuse unchanged field and regenerate corrected transport
        env:
          QUALITY_DATA: target/quality-control-data
          QUALITY_CAPTURE_ONLY: '1'
        run: |
          mkdir -p target/quality-control-data
          cp target/prior-data/field.omd target/prior-data/field.*.json target/quality-control-data/
          bash benchmarks/quality-controls.sh transport-control
          cd target/quality-control-data
          sha256sum *.omd *.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: corrected-control-data
          path: ommatidia/target/quality-control-data
          retention-days: 7
      - name: Archive code and regression evidence
        if: always()
        run: |
          tar --exclude=.git --exclude=target -czf "$RUNNER_TEMP/cache-source.tar.gz" .
          tar --exclude='cache-warm' --exclude='cache-cold' -czf "$RUNNER_TEMP/cache-evidence.tar.gz" target/cache-before target/cache-after target/cache-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capture-cache-regression
          path: |
            ${{ runner.temp }}/cache-source.tar.gz
            ${{ runner.temp }}/cache-evidence.tar.gz
          retention-days: 7
  quality:
    needs: capture
    strategy:
      fail-fast: false
      matrix:
        arm: [transport-control, transport-no-compressed, transport-no-confidence, transport-no-temporal]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: ommatidia
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.capture.outputs.sha }}
          path: ommatidia
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kvark/meganeura
          ref: d903bba0a478277216133719e1eaa31b56d0be10
          path: meganeura
          persist-credentials: false
      - name: Setup
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          sudo apt-get update -qq
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
      - uses: actions/download-artifact@v4
        with:
          name: corrected-control-data
          path: ommatidia/target/quality-control-data
      - name: Verify, train, reload and evaluate
        env:
          ARM: ${{ matrix.arm }}
        run: |
          (cd target/quality-control-data && sha256sum -c SHA256SUMS)
          bash benchmarks/quality-controls.sh "$ARM"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corrected-${{ matrix.arm }}
          path: ommatidia/target/quality-controls/${{ matrix.arm }}
          retention-days: 7
