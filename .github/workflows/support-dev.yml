name: source support development
on:
  pull_request:
    paths: ['.github/workflows/support-dev.yml', '.github/support-edit.py', '.github/support-fix.py']
permissions:
  contents: read
concurrency:
  group: support-development-${{ github.ref }}
  cancel-in-progress: true
env:
  VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
  OMMATIDIA_REQUIRE_GPU: '1'
jobs:
  prepare:
    if: github.event.pull_request.number == 19 && github.head_ref == 'docs/visual-quality-roadmap' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    defaults:
      run:
        shell: bash
        working-directory: ommatidia
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: ommatidia
      - uses: actions/checkout@v4
        with:
          repository: kvark/meganeura
          ref: 43b606ff45b99d23e7e57b5f120f5fc347039082
          path: meganeura
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kvark/blade
          ref: c24621aa6606da968fd1b3967d5993f8aa2b74e8
          path: blade
          persist-credentials: false
      - name: Setup and apply
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
          sudo apt-get update -qq
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
          if test -f .github/support-edit.py; then python3 .github/support-edit.py; fi
          if test -f .github/support-fix.py; then python3 .github/support-fix.py; fi
          cargo +1.92.0 fmt --all
          mkdir -p target/support-validation
      - name: Workspace checks
        run: |
          cargo +1.92.0 check --workspace --all-targets --locked 2>&1 | tee target/support-validation/check.log
          cargo +1.92.0 test --workspace --locked 2>&1 | tee target/support-validation/unit.log
          cargo +1.92.0 clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee target/support-validation/clippy.log
      - name: New GPU contracts
        run: |
          for suite in projected visibility; do
            cargo +1.92.0 test -p ommatidia --test "$suite" --locked -- --ignored --nocapture --test-threads=1 2>&1 | tee "target/support-validation/$suite.log"
          done
      - name: Commit validated source only
        id: commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/docs/visual-quality-roadmap | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch .github/support-edit.py .github/support-fix.py
          git add ommatidia ommatidia-train
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'feat: predicted source visibility and projected-colour selector training'
            git push origin HEAD:refs/heads/docs/visual-quality-roadmap
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Experiment binaries
        run: |
          cargo +1.92.0 build -p ommatidia-train --bin field --bin transport --locked
          mkdir -p target/support-bin
          cp target/debug/field target/debug/transport target/support-bin/
          strip target/support-bin/*
      - uses: actions/upload-artifact@v4
        with:
          name: support-binaries
          path: ommatidia/target/support-bin
          retention-days: 3
      - name: Archive source and tests
        if: always()
        run: tar --exclude=.git --exclude=target/debug --exclude=target/release -czf "$RUNNER_TEMP/support-source.tar.gz" .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: support-source-validation
          path: ${{ runner.temp }}/support-source.tar.gz
          retention-days: 7
  quality:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        arm: [late-rgb, visible-rgb, selector-control, selector-projected]
        seed: [7, 11]
        include:
          - arm: visible-unsupervised
            seed: 7
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: ommatidia
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          path: ommatidia
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: support-binaries
          path: ommatidia/target/support-bin
      - uses: actions/download-artifact@v4
        with:
          run-id: 34153941146
          github-token: ${{ github.token }}
          name: corrected-control-data
          path: ommatidia/target/quality-control-data
      - name: Paired train, reload and evaluate
        env:
          ARM: ${{ matrix.arm }}
          SUPPORT_SEED: ${{ matrix.seed }}
          SUPPORT_UPDATES: '512'
          SUPPORT_FIELD_BIN: target/support-bin/field
          SUPPORT_TRANSPORT_BIN: target/support-bin/transport
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
          chmod +x target/support-bin/*
          (cd target/quality-control-data && sha256sum -c SHA256SUMS)
          bash benchmarks/support-lavapipe.sh "$ARM"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: support-${{ matrix.arm }}-${{ matrix.seed }}
          path: ommatidia/target/support
          retention-days: 7
