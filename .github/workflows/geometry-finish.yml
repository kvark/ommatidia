name: finish geometry diagnostics
on:
  pull_request:
    paths: ['.github/workflows/geometry-finish.yml']
permissions:
  contents: read
jobs:
  validate:
    if: github.event.pull_request.number == 19 && github.head_ref == 'docs/visual-quality-roadmap' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: ommatidia
    env:
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
      OMMATIDIA_REQUIRE_GPU: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: ommatidia
      - uses: actions/checkout@v4
        with:
          repository: kvark/meganeura
          ref: 43b606ff45b99d23e7e57b5f120f5fc347039082
          path: meganeura
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kvark/blade
          ref: c24621aa6606da968fd1b3967d5993f8aa2b74e8
          path: blade
          persist-credentials: false
      - name: Fix metadata type
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ommatidia-train/src/bin/field.rs')
          s=p.read_text()
          assert s.count('    let mut steps = 256;') == 1
          p.write_text(s.replace('    let mut steps = 256;', '    let mut steps = 256usize;'))
          PY
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
          sudo apt-get update -qq
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
          cargo +1.92.0 fmt --all
          mkdir -p target/geometry-validation
      - name: Workspace checks and GPU consistency
        run: |
          cargo +1.92.0 check --workspace --all-targets --locked 2>&1 | tee target/geometry-validation/check.log
          cargo +1.92.0 test --workspace --locked 2>&1 | tee target/geometry-validation/unit.log
          cargo +1.92.0 clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee target/geometry-validation/clippy.log
          cargo +1.92.0 test -p ommatidia --test consistency --locked -- --ignored --nocapture --test-threads=1 2>&1 | tee target/geometry-validation/gpu.log
          cargo +1.92.0 build -p ommatidia-train --bin field --bin noise-risk --locked
      - name: Commit tested correction only
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/docs/visual-quality-roadmap | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ommatidia-train/src/bin/field.rs
          git diff --cached --check
          git commit -m 'fix: type field training-budget counters explicitly'
          git push origin HEAD:refs/heads/docs/visual-quality-roadmap
      - name: Archive source and diagnostic binaries
        if: always()
        run: |
          mkdir -p target/geometry-bin
          for b in field noise-risk; do
            if test -f "target/debug/$b"; then cp "target/debug/$b" target/geometry-bin/; strip "target/geometry-bin/$b"; fi
          done
          tar --exclude=.git --exclude=target/debug --exclude=target/release -czf "$RUNNER_TEMP/geometry-final.tar.gz" .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geometry-final-source
          path: ${{ runner.temp }}/geometry-final.tar.gz
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: geometry-final-binaries
          path: ommatidia/target/geometry-bin
          retention-days: 7
