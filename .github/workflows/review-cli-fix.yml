name: finish reconstruction CLI test
on:
  pull_request:
    paths: ['.github/workflows/review-cli-fix.yml']
permissions:
  contents: read
jobs:
  fix:
    if: github.event.pull_request.number == 18 && github.head_ref == 'reconstruction/candidate-aware-fusion' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Add typed CLI fixtures without changing parsing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ommatidia-train/src/main.rs')
          s = p.read_text()
          needle = '                "--temporal-features" => vec![vec!["--temporal-features", "variance"]],'
          assert s.count(needle) == 1
          s = s.replace(needle, '                "--backbone" => vec![vec!["--backbone", "local"]],\n                "--fusion" => vec![vec!["--fusion", "candidate"]],\n' + needle)
          p.write_text(s)
          PY
      - name: Commit to this review branch only
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/reconstruction/candidate-aware-fusion | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ommatidia-train/src/main.rs
          git diff --cached --check
          git commit -m 'test: exercise candidate fusion and local backbone CLI values'
          git push origin HEAD:refs/heads/reconstruction/candidate-aware-fusion
