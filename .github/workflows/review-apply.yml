name: apply reconstruction review

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/review-apply.yml'
      - '.github/review-payload/**'

permissions:
  contents: read

jobs:
  apply:
    if: github.event.pull_request.number == 18 && github.head_ref == 'reconstruction/candidate-aware-fusion' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ommatidia
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: ommatidia
      - uses: actions/checkout@v4
        with:
          repository: kvark/blade
          ref: 3d7a3977a047fa4f728ab62b6df1663f5a4f9627
          path: blade
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kvark/meganeura
          ref: bf72c42c8639ae8b326361754fc43a478ff837d4
          path: meganeura
          persist-credentials: false
      - name: Install tools
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
      - name: Verify and apply reviewed source
        run: |
          cat .github/review-payload/*.b64 | base64 -d > /tmp/review-bundle.tar.xz
          echo '1927d96e18890f6d826c96e68b75093c8eb1069d2a1cd3bff218dce63c97379f  /tmp/review-bundle.tar.xz' | sha256sum -c -
          mkdir -p /tmp/ommatidia-review
          tar -xJf /tmp/review-bundle.tar.xz -C /tmp/ommatidia-review
          git apply --check /tmp/ommatidia-review/code.patch
          git apply /tmp/ommatidia-review/code.patch
          python3 /tmp/ommatidia-review/docs.py
          python3 .github/review-fix.py
          cargo +1.92.0 fmt --all
      - name: Commit implementation to this review branch only
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/reconstruction/candidate-aware-fusion | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .github/review-payload .github/review-fix.py
          git add README.md docs ommatidia ommatidia-data ommatidia-train
          git diff --cached --check
          git commit -m 'feat: physical candidate-aware fusion, local backbone, and matched transport'
          git push origin HEAD:refs/heads/reconstruction/candidate-aware-fusion
      - name: Check all targets
        run: cargo +1.92.0 check --workspace --all-targets --locked
      - name: Unit tests
        if: success() || failure()
        run: cargo +1.92.0 test --workspace --locked
      - name: Clippy
        if: success() || failure()
        run: cargo +1.92.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: GPU fusion, gradient, recurrence and reset contracts
        if: success() || failure()
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          OMMATIDIA_REQUIRE_GPU: 1
        run: cargo +1.92.0 test -p ommatidia --test gpu_runtime --locked -- --ignored --nocapture --test-threads=1
      - name: Archive formatted source without credentials or build products
        if: always()
        run: tar --exclude=.git --exclude=target -czf "$RUNNER_TEMP/review-source.tar.gz" .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reconstruction-review-validated-source
          path: ${{ runner.temp }}/review-source.tar.gz
          retention-days: 1
