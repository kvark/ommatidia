name: controlled reconstruction study
on:
  workflow_dispatch:
    inputs:
      field_updates:
        description: Field optimizer updates per arm
        default: '2048'
        required: true
      transport_updates:
        description: Transport optimizer updates per arm
        default: '512'
        required: true
      seed:
        description: Optimization seed, not capture seed
        default: '7'
        required: true
permissions:
  contents: read
env:
  VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
  OMMATIDIA_REQUIRE_GPU: '1'
  MEGANEURA_REV: 3d424e02994e69241189be907b77585091ef4347
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: ommatidia
    steps:
      - uses: actions/checkout@v4
        with:
          path: ommatidia
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kvark/meganeura
          ref: ${{ env.MEGANEURA_REV }}
          path: meganeura
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kvark/blade
          ref: c24621aa6606da968fd1b3967d5993f8aa2b74e8
          path: blade
          persist-credentials: false
      - name: Setup
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          sudo apt-get update -qq
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
      - name: Capture shared construction data
        env:
          QUALITY_CAPTURE_ONLY: '1'
        run: |
          bash benchmarks/quality-controls.sh field-midpoint
          bash benchmarks/quality-controls.sh transport-control
          cd target/quality-control-data
          sha256sum *.omd *.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: quality-control-data
          path: ommatidia/target/quality-control-data
          retention-days: 7
  quality:
    needs: capture
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        arm: [field-midpoint, field-stratified, field-fine, field-wide, transport-control, transport-no-compressed, transport-no-confidence, transport-no-temporal]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        shell: bash
        working-directory: ommatidia
    steps:
      - uses: actions/checkout@v4
        with:
          path: ommatidia
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kvark/meganeura
          ref: ${{ env.MEGANEURA_REV }}
          path: meganeura
          persist-credentials: false
      - name: Setup
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          sudo apt-get update -qq
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
      - uses: actions/download-artifact@v4
        with:
          name: quality-control-data
          path: ommatidia/target/quality-control-data
      - name: Verify shared capture bytes
        run: cd target/quality-control-data && sha256sum -c SHA256SUMS
      - name: Train, reload and evaluate
        env:
          ARM: ${{ matrix.arm }}
          QUALITY_SEED: ${{ inputs.seed }}
          QUALITY_UPDATES: ${{ startsWith(matrix.arm, 'field-') && inputs.field_updates || inputs.transport_updates }}
        run: bash benchmarks/quality-controls.sh "$ARM"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-${{ matrix.arm }}
          path: ommatidia/target/quality-controls/${{ matrix.arm }}
          retention-days: 7
  report:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: control-*
          path: target/quality-controls
      - run: python3 benchmarks/report-controls.py target/quality-controls
      - uses: actions/upload-artifact@v4
        with:
          name: quality-control-summary
          path: target/quality-controls/summary.*
          retention-days: 7
