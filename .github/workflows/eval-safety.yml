name: checkpoint recovery output safety
on:
  pull_request:
    paths: ['.github/workflows/eval-safety.yml']
permissions:
  contents: read
jobs:
  fix:
    if: github.event.pull_request.number == 19 && github.head_ref == 'docs/visual-quality-roadmap' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: ommatidia
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: ommatidia
      - uses: actions/checkout@v4
        with:
          repository: kvark/meganeura
          ref: 3d424e02994e69241189be907b77585091ef4347
          path: meganeura
          persist-credentials: false
      - name: Guard recovery before output writes
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ommatidia-train/src/bin/field.rs');s=p.read_text()
          needle='    if let Some(path) = &eval_checkpoint {\n'
          assert s.count(needle)==1
          s=s.replace(needle,needle+'''        let source = path.canonicalize()?;
                  let directory = source.parent().ok_or("checkpoint has no parent directory")?;
                  if out.exists() && out.canonicalize()? == directory {
                      return Err("checkpoint recovery requires a separate output directory".into());
                  }
          ''')
          p.write_text(s)
          p=Path('ommatidia-train/tests/field_recovery.rs');p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text('''//! Recovery must not overwrite the original run's metadata, even via `..`.
          #[test]
          fn recovery_rejects_its_source_directory_before_writing() {
              let root=std::env::temp_dir().join(format!("field-recovery-{}",std::process::id()));
              std::fs::create_dir_all(root.join("child")).unwrap();
              for name in ["model.safetensors","model.field.json","loss.csv"] {
                  std::fs::write(root.join(name),b"original run").unwrap();
              }
              let output=std::process::Command::new(env!("CARGO_BIN_EXE_field"))
                  .arg("--data").arg("not-read.omd")
                  .arg("--eval-checkpoint").arg(root.join("model.safetensors"))
                  .arg("--out").arg(root.join("child/.."))
                  .output().unwrap();
              assert!(!output.status.success());
              assert!(String::from_utf8_lossy(&output.stderr).contains("separate output directory"));
              for name in ["model.safetensors","model.field.json","loss.csv"] {
                  assert_eq!(std::fs::read(root.join(name)).unwrap(),b"original run");
              }
              std::fs::remove_dir_all(root).unwrap();
          }
          ''')
          PY
          cargo +1.92.0 fmt --all
          cargo +1.92.0 test -p ommatidia-train --test field_recovery --locked
      - name: Commit validated safety regression
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/docs/visual-quality-roadmap | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ommatidia-train/src/bin/field.rs ommatidia-train/tests/field_recovery.rs
          git diff --cached --check
          git commit -m 'fix: prevent checkpoint evaluation from overwriting its source run'
          git push origin HEAD:refs/heads/docs/visual-quality-roadmap
