name: masked selector validation
on:
  pull_request:
    paths: ['.github/workflows/masked-validation.yml', '.github/masked-fix.py']
permissions:
  contents: read
concurrency:
  group: masked-validation-${{ github.ref }}
  cancel-in-progress: true
env:
  VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
  OMMATIDIA_REQUIRE_GPU: '1'
  MEGANEURA_REV: 185b1014bba05e760d4679e1db4fde38ece2e056
  CARGO_PROFILE_DEV_OPT_LEVEL: '1'
  CARGO_PROFILE_DEV_DEBUG: '0'
jobs:
  prepare:
    if: github.event.pull_request.number == 19 && github.head_ref == 'docs/visual-quality-roadmap' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    defaults:
      run:
        shell: bash
        working-directory: ommatidia
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: ommatidia
      - uses: actions/checkout@v4
        with:
          repository: kvark/meganeura
          ref: ${{ env.MEGANEURA_REV }}
          path: meganeura
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kvark/blade
          ref: c24621aa6606da968fd1b3967d5993f8aa2b74e8
          path: blade
          persist-credentials: false
      - name: Apply reviewed patch and install tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/kvark/ommatidia/git/blobs/57e89724358299828fd843f74d7b10ed50c13d6b --jq .content | base64 -d | xz -dc > /tmp/masked.patch
          echo '4f8be37006f48e038c07a42362f7701faed1048dd2ca8acd5f09755ef67fffba  /tmp/masked.patch' | sha256sum -c -
          git apply --check /tmp/masked.patch
          git apply /tmp/masked.patch
          if test -f .github/masked-fix.py; then python3 .github/masked-fix.py; fi
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
          cargo +1.92.0 fmt --all
          mkdir -p target/masked-validation
      - name: Workspace and mathematical GPU checks
        run: |
          cargo +1.92.0 check --workspace --all-targets --locked 2>&1 | tee target/masked-validation/check.log
          cargo +1.92.0 test --workspace --locked 2>&1 | tee target/masked-validation/unit.log
          cargo +1.92.0 clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee target/masked-validation/clippy.log
          cargo +1.92.0 test -p ommatidia --test masked_softmax --test mixture_mass --test remodulated --test transport --locked -- --ignored --nocapture --test-threads=1 2>&1 | tee target/masked-validation/gpu.log
      - name: Build identical experiment binaries
        run: |
          cargo +1.92.0 build -p ommatidia-train --bin fit --bin transport --locked
          mkdir -p target/masked-bin
          cp target/debug/fit target/debug/transport target/masked-bin/
          strip target/masked-bin/*
          sha256sum target/masked-bin/* > target/masked-validation/binaries.sha256
      - name: Commit tested source to this branch only
        id: commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/docs/visual-quality-roadmap | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch .github/masked-fix.py
          git add ommatidia/src/transport ommatidia/tests/masked_softmax.rs ommatidia-train/src/bin/fit.rs ommatidia-train/src/bin/fit/selector.rs ommatidia-train/src/bin/transport.rs
          git diff --cached --check
          git commit -m 'feat: versioned prior-aware masked-softmax reconstruction selector'
          git push origin HEAD:refs/heads/docs/visual-quality-roadmap
          git rev-parse HEAD | tee target/masked-validation/source-sha.txt
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: masked-binaries
          path: ommatidia/target/masked-bin
          retention-days: 7
      - name: Archive source and validation without credentials
        if: always()
        run: tar --exclude=.git --exclude=target/debug --exclude=target/release -czf "$RUNNER_TEMP/masked-source.tar.gz" .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: masked-source-validation
          path: ${{ runner.temp }}/masked-source.tar.gz
          retention-days: 7
  fitting:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        mixture: [softplus, masked-softmax]
        frame: [0, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: masked-binaries
          path: bin
      - uses: actions/download-artifact@v4
        with:
          run-id: 34178844726
          github-token: ${{ github.token }}
          name: geometry-noise-risk
          path: noise
      - name: Matched frozen candidates, seed and optimizer budget
        shell: bash
        env:
          MIXTURE: ${{ matrix.mixture }}
          FRAME: ${{ matrix.frame }}
          SOURCE: ${{ needs.prepare.outputs.sha }}
        run: |
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
          chmod +x bin/fit
          capture=noise/noise-7/data/noise0.omd
          mkdir -p evidence
          args=(bin/fit --task selector-rgb --mixture "$MIXTURE" --data "$capture" --out "evidence/$MIXTURE-$FRAME" --frame "$FRAME" --seed 7 --steps 512)
          { echo "$SOURCE"; echo "$MEGANEURA_REV"; printf '%q ' "${args[@]}"; echo; sha256sum "$capture" "${capture%.omd}."*json; } > evidence/recipe.txt
          "${args[@]}" 2>&1 | tee evidence/run.log
          find evidence -name diagnostic.safetensors -o -name quality.json | sort | xargs sha256sum > evidence/results.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: masked-fit-${{ matrix.mixture }}-${{ matrix.frame }}
          path: evidence
          retention-days: 7
  causal:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        mixture: [softplus, masked-softmax]
        seed: [7, 11]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: masked-binaries
          path: bin
      - uses: actions/download-artifact@v4
        with:
          run-id: 34178844726
          github-token: ${{ github.token }}
          name: geometry-noise-risk
          path: noise
      - name: Paired training and each model's own held-noise history
        shell: bash
        env:
          MIXTURE: ${{ matrix.mixture }}
          SEED: ${{ matrix.seed }}
          SOURCE: ${{ needs.prepare.outputs.sha }}
        run: |
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
          chmod +x bin/transport
          out="evidence/$MIXTURE-$SEED"
          mkdir -p "$out"
          args=(bin/transport --out "$out" --mixture "$MIXTURE" --steps 512 --seed "$SEED" --channels 8 --unroll 2 --construction-noise --fixed-exposure-loss --compressed-weight 0 --physical-weight 1 --low-frequency-weight 0 --confidence-weight 0 --temporal-weight 0)
          for i in 0 1 2; do args+=(--data "noise/noise-7/data/noise$i.omd"); done
          for i in 3 4 5; do args+=(--eval-data "noise/noise-7/data/noise$i.omd"); done
          { echo "$SOURCE"; echo "$MEGANEURA_REV"; printf '%q ' "${args[@]}"; echo; sha256sum noise/noise-7/data/*.omd noise/noise-7/data/*.json; } > "$out/recipe.txt"
          "${args[@]}" 2>&1 | tee "$out/run.log"
          sha256sum "$out/model.safetensors" "$out/quality.json" > "$out/results.sha256"
          if bin/transport --out "$out" --eval-only --mixture "$MIXTURE" > "$out/admission.log" 2>&1; then exit 1; fi
          grep -q 'evaluation reads mixture from the checkpoint sidecar' "$out/admission.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: masked-causal-${{ matrix.mixture }}-${{ matrix.seed }}
          path: evidence
          retention-days: 7
