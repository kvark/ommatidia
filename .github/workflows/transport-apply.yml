name: reconstruction development
on:
  pull_request:
    paths: ['.github/workflows/transport-apply.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.number == 18 && github.head_ref == 'reconstruction/candidate-aware-fusion' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
      OMMATIDIA_REQUIRE_GPU: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: ommatidia
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kvark/meganeura
          ref: d903bba0a478277216133719e1eaa31b56d0be10
          path: meganeura
          persist-credentials: false
      - name: Install tools
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
          sudo apt-get update -qq
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
      - name: Check
        working-directory: ommatidia
        run: cargo +1.92.0 check --workspace --all-targets
      - name: Archive sources without credentials or build products
        if: always()
        run: tar --exclude=.git --exclude=target -czf "$RUNNER_TEMP/field-source.tar.gz" ommatidia meganeura
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-source
          path: ${{ runner.temp }}/field-source.tar.gz
          retention-days: 3
