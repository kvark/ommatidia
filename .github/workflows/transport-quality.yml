name: transport quality (LavaPipe)
on:
  workflow_dispatch:
  push:
    branches: [docs/visual-quality-roadmap]
    paths: ['.github/workflows/transport-quality.yml']
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TRANSPORT_UPDATES: '512'
      TRANSPORT_TRAIN_SCENES: '8'
      TRANSPORT_HOLD_SCENES: '4'
      TRANSPORT_HOLD_SEED: '50000'
    steps:
      - uses: actions/checkout@v4
        with:
          path: ommatidia
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kvark/blade
          ref: c24621aa6606da968fd1b3967d5993f8aa2b74e8
          path: blade
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kvark/meganeura
          ref: d903bba0a478277216133719e1eaa31b56d0be10
          path: meganeura
          persist-credentials: false
      - name: Setup
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          sudo apt-get update -qq
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
      - name: Paired loss-normalization quality experiment
        working-directory: ommatidia
        run: bash benchmarks/normalization-lavapipe.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: normalization-lavapipe-quality
          path: ommatidia/target/normalization-quality
          retention-days: 7
