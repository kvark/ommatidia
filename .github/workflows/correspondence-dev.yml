name: correspondence development
on:
  pull_request:
    paths: ['.github/workflows/correspondence-dev.yml', '.github/correspondence-fix.py']
permissions:
  contents: read
concurrency:
  group: correspondence-development-${{ github.ref }}
  cancel-in-progress: true
env:
  VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
  OMMATIDIA_REQUIRE_GPU: '1'
jobs:
  prepare:
    if: github.event.pull_request.number == 19 && github.head_ref == 'docs/visual-quality-roadmap' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    defaults:
      run:
        shell: bash
        working-directory: ommatidia
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: ommatidia
      - uses: actions/checkout@v4
        with:
          repository: kvark/meganeura
          ref: 43b606ff45b99d23e7e57b5f120f5fc347039082
          path: meganeura
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kvark/blade
          ref: c24621aa6606da968fd1b3967d5993f8aa2b74e8
          path: blade
          persist-credentials: false
      - name: Apply inspected source and install tools
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, subprocess
          from pathlib import Path
          parts=sorted(Path('.github/correspondence-payload').glob('*.txt'))
          if parts:
              packed=base64.b64decode(''.join(p.read_text() for p in parts))
              assert hashlib.sha256(packed).hexdigest()=='1242a80ebb3a5ac7c20cc77e7e4b11e09622aaadd122abd1503ef27103edc554'
              bundle=json.loads(lzma.decompress(packed))
              Path('/tmp/correspondence.patch').write_text(bundle['patch'])
              subprocess.run(['git','apply','--check','/tmp/correspondence.patch'],check=True)
              subprocess.run(['git','apply','/tmp/correspondence.patch'],check=True)
              for name,content in bundle['files'].items():
                  p=Path(name)
                  assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts and not p.exists()
                  p.parent.mkdir(parents=True,exist_ok=True);p.write_text(content)
          PY
          if test -f .github/correspondence-fix.py; then python3 .github/correspondence-fix.py; fi
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
          sudo apt-get update -qq
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
          cargo +1.92.0 fmt --all
          mkdir -p target/correspondence-validation
      - name: Workspace validation
        run: |
          cargo +1.92.0 check --workspace --all-targets --locked 2>&1 | tee target/correspondence-validation/check.log
          cargo +1.92.0 test --workspace --locked 2>&1 | tee target/correspondence-validation/unit.log
          cargo +1.92.0 clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee target/correspondence-validation/clippy.log
      - name: GPU geometry, gradient and native reconstruction tests
        run: |
          cargo +1.92.0 test -p ommatidia --test stereo --test remodulated --test late_rgb --test visibility --test consistency --locked -- --ignored --nocapture --test-threads=1 2>&1 | tee target/correspondence-validation/gpu.log
      - name: Build optimized experiment binaries
        env:
          CARGO_PROFILE_DEV_OPT_LEVEL: '1'
          CARGO_PROFILE_DEV_DEBUG: '0'
        run: |
          cargo +1.92.0 build -p ommatidia-train --bin field --bin transport --locked
          mkdir -p target/correspondence-bin
          cp target/debug/field target/debug/transport target/correspondence-bin/
          strip target/correspondence-bin/*
      - name: Commit validated source only
        id: commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/docs/visual-quality-roadmap | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r --ignore-unmatch .github/correspondence-payload .github/correspondence-fix.py
          git add ommatidia ommatidia-train
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'feat: multiview depth-hypothesis matching and final-RGB selector construction'
            git push origin HEAD:refs/heads/docs/visual-quality-roadmap
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: correspondence-binaries
          path: ommatidia/target/correspondence-bin
          retention-days: 7
      - name: Archive reviewed source and test evidence
        if: always()
        run: tar --exclude=.git --exclude=target/debug --exclude=target/release -czf "$RUNNER_TEMP/correspondence-source.tar.gz" .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correspondence-source
          path: ${{ runner.temp }}/correspondence-source.tar.gz
          retention-days: 7
  quality:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        arm: [field-visible, field-stereo, selector-lobes, selector-rgb]
        seed: [7, 11]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
        working-directory: ommatidia
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          path: ommatidia
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: correspondence-binaries
          path: ommatidia/target/correspondence-bin
      - uses: actions/download-artifact@v4
        with:
          run-id: 34153941146
          github-token: ${{ github.token }}
          name: corrected-control-data
          path: ommatidia/target/quality-control-data
      - uses: actions/download-artifact@v4
        with:
          run-id: 34178844726
          github-token: ${{ github.token }}
          name: geometry-noise-risk
          path: ommatidia/target/noise-capture
      - name: Train, reload and score paired data
        env:
          ARM: ${{ matrix.arm }}
          CORRESPONDENCE_SEED: ${{ matrix.seed }}
          CORRESPONDENCE_FIELD_BIN: target/correspondence-bin/field
          CORRESPONDENCE_TRANSPORT_BIN: target/correspondence-bin/transport
          CORRESPONDENCE_NOISE_DATA: target/noise-capture/noise-7/data
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
          chmod +x target/correspondence-bin/*
          (cd target/quality-control-data && sha256sum -c SHA256SUMS)
          bash benchmarks/correspondence-lavapipe.sh "$ARM"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correspondence-${{ matrix.arm }}-${{ matrix.seed }}
          path: ommatidia/target/correspondence
          retention-days: 7
