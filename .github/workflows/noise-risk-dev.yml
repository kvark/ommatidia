name: noise risk objective validation
on:
  pull_request:
    paths: ['.github/workflows/noise-risk-dev.yml', '.github/noise-mean-fix.py']
permissions:
  contents: read
jobs:
  validate:
    if: github.event.pull_request.number == 19 && github.head_ref == 'docs/visual-quality-roadmap' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: ommatidia
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: ommatidia
      - uses: actions/checkout@v4
        with:
          repository: kvark/meganeura
          ref: 43b606ff45b99d23e7e57b5f120f5fc347039082
          path: meganeura
          persist-credentials: false
      - name: Validate inspected risk objective and checks
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
          if test -f .github/noise-mean-fix.py; then python3 .github/noise-mean-fix.py; fi
          cargo +1.92.0 fmt --all
          cargo +1.92.0 check --workspace --all-targets --locked
          cargo +1.92.0 test --workspace --locked
          cargo +1.92.0 clippy --workspace --all-targets --locked -- -D warnings
          cargo +1.92.0 build -p ommatidia-train --bin noise-risk --locked
          mkdir -p target/noise-checked
          cp target/debug/noise-risk target/noise-checked/
          strip target/noise-checked/noise-risk
      - name: Commit tested source only
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/docs/visual-quality-roadmap | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch .github/noise-mean-fix.py
          git add ommatidia/src/transport/noise.rs ommatidia-train/src/bin/noise-risk.rs
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'fix: fit mean linear candidate risk and verify native reconstruction'
            git push origin HEAD:refs/heads/docs/visual-quality-roadmap
          fi
          git rev-parse HEAD > target/noise-checked/source-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: noise-checked-binary
          path: ommatidia/target/noise-checked
          retention-days: 7
      - name: Archive inspected source
        if: always()
        run: tar --exclude=.git --exclude=target -czf "$RUNNER_TEMP/noise-checked-source.tar.gz" .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noise-checked-source
          path: ${{ runner.temp }}/noise-checked-source.tar.gz
          retention-days: 7
