name: finish cross-noise validation
on:
  pull_request:
    paths: ['.github/workflows/noise-risk-dev.yml', '.github/noise-mean-fix.py']
permissions:
  contents: read
jobs:
  validate:
    if: github.event.pull_request.number == 19 && github.head_ref == 'docs/visual-quality-roadmap' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: ommatidia
    env:
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
      OMMATIDIA_REQUIRE_GPU: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: ommatidia
      - uses: actions/checkout@v4
        with:
          repository: kvark/meganeura
          ref: 43b606ff45b99d23e7e57b5f120f5fc347039082
          path: meganeura
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kvark/blade
          ref: c24621aa6606da968fd1b3967d5993f8aa2b74e8
          path: blade
          persist-credentials: false
      - name: Validate objective, isolation and RGB checks
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
          sudo apt-get update -qq
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
          if test -f .github/noise-mean-fix.py; then python3 .github/noise-mean-fix.py; fi
          cargo +1.92.0 fmt --all
          mkdir -p target/noise-validation
          cargo +1.92.0 check --workspace --all-targets --locked 2>&1 | tee target/noise-validation/check.log
          cargo +1.92.0 test --workspace --locked 2>&1 | tee target/noise-validation/unit.log
          cargo +1.92.0 clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee target/noise-validation/clippy.log
          cargo +1.92.0 test -p ommatidia --test consistency --test candidate_oracle --locked -- --ignored --nocapture --test-threads=1 2>&1 | tee target/noise-validation/gpu.log
          cargo +1.92.0 build -p ommatidia-train --bin noise-risk --locked
      - uses: actions/download-artifact@v4
        with:
          run-id: 34178844726
          github-token: ${{ github.token }}
          name: geometry-noise-risk
          path: ommatidia/target/original-noise
      - uses: actions/download-artifact@v4
        with:
          run-id: 34174073553
          github-token: ${{ github.token }}
          name: support-selector-control-7
          path: ommatidia/target/prior-selector
      - name: Score complete held-noise streams from unchanged weights
        run: |
          checkpoint=target/prior-selector/selector-control-7/model.safetensors
          sha256sum "$checkpoint" > target/noise-validation/checkpoint.sha256
          args=()
          for i in {0..5}; do args+=(--data "target/original-noise/noise-7/data/noise$i.omd"); done
          command=(target/debug/noise-risk "${args[@]}" --fit-realizations 3 --checkpoint "$checkpoint" --out target/noise-validation/scores)
          printf '%q ' "${command[@]}" > target/noise-validation/command.txt
          "${command[@]}" 2>&1 | tee target/noise-validation/run.log
          sha256sum -c target/noise-validation/checkpoint.sha256
          if target/debug/noise-risk --data target/original-noise/noise-7/data/noise0.omd "${args[@]}" --fit-realizations 3 --checkpoint "$checkpoint" --out target/noise-validation/invalid > target/noise-validation/rejection.log 2>&1; then
            echo 'overlapping streams were accepted' >&2; exit 1
          fi
          grep -q 'overlapping path streams' target/noise-validation/rejection.log
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('target/noise-validation/scores')
          d=json.loads((root/'quality.json').read_text())
          assert d['risk_target']=='linear_lobe_mse'
          assert len(d['results'])==2
          for mode in d['results']:
              assert len(mode['frames'])==8*3*6
              assert mode['native_recomposition_max_relative_difference']<1e-5
          for p in root.glob('*/*-learned.png'):
              old=Path('target/original-noise/noise-7/scores')/p.relative_to(root)
              assert p.read_bytes()==old.read_bytes(), p
          PY
      - name: Commit validated correction only
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/docs/visual-quality-roadmap | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch .github/noise-mean-fix.py
          git add ommatidia/src/transport/noise.rs ommatidia-train/src/bin/noise-risk.rs
          git diff --cached --check
          git commit -m 'fix: isolate fitted risk from held availability and score native RGB'
          git push origin HEAD:refs/heads/docs/visual-quality-roadmap
          git rev-parse HEAD > target/noise-validation/source-sha.txt
      - name: Archive inspected source
        if: always()
        run: |
          tar --exclude=.git --exclude=target -czf "$RUNNER_TEMP/noise-checked-source.tar.gz" .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noise-checked-source
          path: ${{ runner.temp }}/noise-checked-source.tar.gz
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geometry-noise-verified
          path: ommatidia/target/noise-validation
          retention-days: 7
