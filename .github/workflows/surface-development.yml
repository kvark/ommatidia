name: surface supervision development
on:
  pull_request:
    paths: ['.github/workflows/surface-development.yml', '.github/surface-fix.py']
permissions:
  contents: read
concurrency:
  group: surface-development-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.event.pull_request.number == 19 && github.head_ref == 'docs/visual-quality-roadmap' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
      OMMATIDIA_REQUIRE_GPU: '1'
      RUST_BACKTRACE: '1'
    defaults:
      run:
        shell: bash
        working-directory: ommatidia
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: ommatidia
      - uses: actions/checkout@v4
        with:
          repository: kvark/meganeura
          ref: d903bba0a478277216133719e1eaa31b56d0be10
          path: meganeura
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kvark/blade
          ref: c24621aa6606da968fd1b3967d5993f8aa2b74e8
          path: blade
          persist-credentials: false
      - name: Install Rust and software Vulkan
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
          sudo apt-get update -qq
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
      - name: Apply source
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, subprocess
          from pathlib import Path
          packed=base64.b64decode(Path('.github/surface.patch.b64').read_text().strip(),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='a80308825157204449805897f6514dcee3d234dad9b2e20037a98dcec8ef18d6'
          Path('/tmp/surface.patch').write_bytes(lzma.decompress(packed))
          subprocess.run(['git','apply','--check','/tmp/surface.patch'],check=True)
          subprocess.run(['git','apply','/tmp/surface.patch'],check=True)
          PY
          if test -f .github/surface-fix.py; then python3 .github/surface-fix.py; fi
          cargo +1.92.0 fmt --all
          mkdir -p target/surface-validation
      - name: Workspace checks
        run: |
          cargo +1.92.0 check --workspace --all-targets --locked 2>&1 | tee target/surface-validation/check.log
          cargo +1.92.0 test --workspace --locked 2>&1 | tee target/surface-validation/unit.log
          cargo +1.92.0 clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee target/surface-validation/clippy.log
      - name: GPU contracts
        run: |
          for suite in gpu_runtime transport field; do
            cargo +1.92.0 test -p ommatidia --test "$suite" --locked -- --ignored --nocapture --test-threads=1 2>&1 | tee "target/surface-validation/$suite.log"
          done
          cargo +1.92.0 test -p ommatidia-data incident_capture --locked -- --ignored --nocapture --test-threads=1 2>&1 | tee target/surface-validation/capture.log
      - name: Commit verified source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/docs/visual-quality-roadmap | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/surface.patch.b64
          git rm --ignore-unmatch .github/surface-fix.py
          git add ommatidia ommatidia-data ommatidia-train benchmarks
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --check
          git commit -m 'feat: target-only surface termination and field-fit diagnostics'
          git push origin HEAD:refs/heads/docs/visual-quality-roadmap
      - name: Field construction ablation
        run: bash benchmarks/surface-lavapipe.sh
      - name: Realtime transport quality
        env:
          TRANSPORT_UPDATES: '512'
          TRANSPORT_TRAIN_SCENES: '8'
          TRANSPORT_HOLD_SCENES: '4'
        run: bash benchmarks/transport-lavapipe.sh
      - name: Archive source and evidence
        if: always()
        run: tar --exclude=.git --exclude=target/debug --exclude=target/release -czf "$RUNNER_TEMP/surface-validation.tar.gz" .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surface-validation
          path: ${{ runner.temp }}/surface-validation.tar.gz
          retention-days: 7
