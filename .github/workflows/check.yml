name: check

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Sibling checkouts overlay the git pins in Cargo.toml through [patch].
  BLADE_REV: fbb4f28c4869e81ae15de58925945b423b9c1ac5
  MEGANEURA_REV: 0dbfcc0029bf98b33a03fc792e1f4e90ead17f23

jobs:
  platform:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux/Vulkan
            os: ubuntu-latest
          - name: Windows/Vulkan
            os: windows-latest
          - name: macOS/Metal
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out Ommatidia
        uses: actions/checkout@v4
        with:
          path: ommatidia
      - name: Check out Blade
        uses: actions/checkout@v4
        with:
          repository: kvark/blade
          ref: ${{ env.BLADE_REV }}
          path: blade
      - name: Check out Meganeura
        uses: actions/checkout@v4
        with:
          repository: kvark/meganeura
          ref: ${{ env.MEGANEURA_REV }}
          path: meganeura
      - name: Install Rust
        run: rustup toolchain install 1.92.0 --profile minimal
      - name: Check workspace
        working-directory: ommatidia
        run: cargo +1.92.0 check --workspace --all-targets --locked

  check:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Ommatidia
        uses: actions/checkout@v4
        with:
          path: ommatidia
      - name: Check out Blade
        uses: actions/checkout@v4
        with:
          repository: kvark/blade
          ref: ${{ env.BLADE_REV }}
          path: blade
      - name: Check out Meganeura
        uses: actions/checkout@v4
        with:
          repository: kvark/meganeura
          ref: ${{ env.MEGANEURA_REV }}
          path: meganeura
      - name: Install Rust
        run: rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
      - name: Format
        working-directory: ommatidia
        run: cargo +1.92.0 fmt --all -- --check
      - name: Check quality harness syntax
        working-directory: ommatidia
        run: |
          python3 -m py_compile scripts/record-run.py scripts/verify-results.py scripts/fetch-catalog.py
          python3 scripts/test-fetch-catalog.py
          bash -n scripts/check-cache.sh scripts/capture-catalog.sh
      - name: Check published result evidence
        working-directory: ommatidia
        run: python3 scripts/verify-results.py
      - name: Clippy
        working-directory: ommatidia
        run: cargo +1.92.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: Unit tests
        working-directory: ommatidia
        run: cargo +1.92.0 test --workspace --locked

  lavapipe:
    name: Reconstruction checks (LavaPipe)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
    steps:
      - name: Check out Ommatidia
        uses: actions/checkout@v4
        with:
          path: ommatidia
      - name: Check out Blade
        uses: actions/checkout@v4
        with:
          repository: kvark/blade
          ref: ${{ env.BLADE_REV }}
          path: blade
      - name: Check out Meganeura
        uses: actions/checkout@v4
        with:
          repository: kvark/meganeura
          ref: ${{ env.MEGANEURA_REV }}
          path: meganeura
      - name: Install Rust and LavaPipe
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers vulkan-validationlayers
      - name: Check gradients, raw features, recurrence, HDR and reload
        working-directory: ommatidia
        run: python3 scripts/record-run.py target/ci-gpu -- cargo +1.92.0 test -p ommatidia --test transport --locked -- --ignored --nocapture --test-threads=1
      - name: Check capture independence from cached textures
        working-directory: ommatidia
        run: bash scripts/check-cache.sh
      - name: Capture, train and reload the residual model
        working-directory: ommatidia
        run: |
          for split in train dev; do
            seed=7
            if [ "$split" = dev ]; then seed=700; fi
            python3 scripts/record-run.py target/ci-capture-$split -- \
              cargo +1.92.0 run -p ommatidia-data --locked -- \
              --out target/$split.omd --samples 1 --seed "$seed" --lr 16x16 \
              --canonical-frames 2 --sequence-frames 2 --canopy --textures \
              --random-camera-motion 0.03 --projection-jitter --hr-gbuffer --split-radiance
          done
          python3 scripts/record-run.py target/ci-train -- \
            cargo +1.92.0 run -p ommatidia-train --bin transport --locked -- \
            --data target/train.omd --eval-data target/dev.omd --out target/smoke \
            --steps 8 --channels 4 --eval-every 0
          python3 scripts/record-run.py target/ci-reload -- \
            cargo +1.92.0 run -p ommatidia-train --bin transport --locked -- \
            --eval-data target/dev.omd --out target/reload --eval-only \
            --checkpoint target/smoke/model.safetensors
          cmp target/smoke/frames.csv target/reload/frames.csv
      - name: Upload numerical and capture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconstruction-checks
          path: |
            ommatidia/target/ci-*/
            ommatidia/target/cache-quality/comparison.json
            ommatidia/target/smoke/
            ommatidia/target/reload/
          retention-days: 7
