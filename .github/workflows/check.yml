name: check

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Blade checkout supplies capture shaders only; crates resolve through Cargo.lock.
  BLADE_REV: c24621aa6606da968fd1b3967d5993f8aa2b74e8
  MEGANEURA_REV: d903bba0a478277216133719e1eaa31b56d0be10

jobs:
  platform:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux/Vulkan
            os: ubuntu-latest
          - name: Windows/Vulkan
            os: windows-latest
          - name: macOS/Metal
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out Ommatidia
        uses: actions/checkout@v4
        with:
          path: ommatidia
      - name: Check out Blade
        uses: actions/checkout@v4
        with:
          repository: kvark/blade
          ref: ${{ env.BLADE_REV }}
          path: blade
      - name: Check out Meganeura
        uses: actions/checkout@v4
        with:
          repository: kvark/meganeura
          ref: ${{ env.MEGANEURA_REV }}
          path: meganeura
      - name: Install Rust
        run: rustup toolchain install 1.92.0 --profile minimal
      - name: Check workspace
        working-directory: ommatidia
        run: cargo +1.92.0 check --workspace --all-targets --locked

  check:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Ommatidia
        uses: actions/checkout@v4
        with:
          path: ommatidia
      - name: Check out Blade
        uses: actions/checkout@v4
        with:
          repository: kvark/blade
          ref: ${{ env.BLADE_REV }}
          path: blade
      - name: Check out Meganeura
        uses: actions/checkout@v4
        with:
          repository: kvark/meganeura
          ref: ${{ env.MEGANEURA_REV }}
          path: meganeura
      - name: Install Rust
        run: rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
      - name: Format
        working-directory: ommatidia
        run: cargo +1.92.0 fmt --all -- --check
      - name: Check quality harness syntax
        working-directory: ommatidia
        run: |
          python3 -m py_compile benchmarks/report-controls.py
          bash -n benchmarks/quality-controls.sh benchmarks/cache-lavapipe.sh
      - name: Clippy
        working-directory: ommatidia
        run: cargo +1.92.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: Unit tests
        working-directory: ommatidia
        run: cargo +1.92.0 test --workspace --locked
      - name: Build and run the plain-C ABI example
        working-directory: ommatidia
        run: |
          cargo +1.92.0 build --release -p ommatidia-capi --locked
          cc -std=c11 -Wall -Wextra -Werror -Iinclude examples/c/inspect.c \
            -Ltarget/release -lommatidia_native -o target/ommatidia-inspect
          LD_LIBRARY_PATH="$PWD/target/release" target/ommatidia-inspect

  lavapipe:
    name: GPU image reference (LavaPipe)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
      OMMATIDIA_REQUIRE_GPU: 1
    steps:
      - name: Check out Ommatidia
        uses: actions/checkout@v4
        with:
          path: ommatidia
      - name: Check out Blade
        uses: actions/checkout@v4
        with:
          repository: kvark/blade
          ref: ${{ env.BLADE_REV }}
          path: blade
      - name: Check out Meganeura
        uses: actions/checkout@v4
        with:
          repository: kvark/meganeura
          ref: ${{ env.MEGANEURA_REV }}
          path: meganeura
      - name: Install Rust and LavaPipe
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
      - name: Run GPU contract, recurrence, training and image tests
        working-directory: ommatidia
        run: |
          cargo +1.92.0 test -p ommatidia --test gpu_runtime --locked -- --ignored --nocapture --test-threads=1
          cargo +1.92.0 test -p ommatidia --test transport --locked -- --ignored --nocapture --test-threads=1
          cargo +1.92.0 test -p ommatidia --test field --locked -- --ignored --nocapture --test-threads=1
          cargo +1.92.0 test -p ommatidia --test quality_controls --locked -- --ignored --nocapture --test-threads=1
          cargo +1.92.0 test -p ommatidia-data incident_capture --locked -- --ignored --nocapture --test-threads=1
      - name: Check capture independence from cached textures
        working-directory: ommatidia
        env:
          CACHE_RESULTS: target/cache-regression
        run: bash benchmarks/cache-lavapipe.sh
      - name: Capture moving, jittered geometry and lighting
        working-directory: ommatidia
        run: |
          cargo +1.92.0 run -p ommatidia-data --locked -- \
            --out target/catalog-smoke.omd --samples 1 --lr 16x16 \
            --canonical-frames 2 --catalog ommatidia-data/tests/fixtures/catalog.json \
            --catalog-kind object --catalog-split train --catalog-objects 1 \
            --sequence-frames 2 --random-camera-motion 0.05 --light-motion 0.03 \
            --projection-jitter --hr-gbuffer --split-radiance
          test -s target/catalog-smoke.omd
          test "$(jq -r '.scenes[0].families[0]' target/catalog-smoke.catalog.json)" = fixture-plane
          test "$(jq -r '.matching_path_depth' target/catalog-smoke.transport.json)" = true
          cargo +1.92.0 run -p ommatidia-data --locked -- \
            --out target/restir-motion-smoke.omd --samples 1 --lr 16x16 \
            --canonical-frames 1 --sequence-frames 2 \
            --random-camera-motion 0.05 --restir-input --hr-gbuffer
          test -s target/restir-motion-smoke.omd
      - name: Train and reload a field on held-scene RGB
        working-directory: ommatidia
        run: bash benchmarks/field-lavapipe.sh
      - name: Capture and train centre-ray surface labels
        working-directory: ommatidia
        env:
          FIELD_IMAGE: '16'
          FIELD_UPDATES: '8'
          SURFACE_RESULTS: target/surface-smoke
        run: bash benchmarks/surface-lavapipe.sh
      - name: Upload field quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: field-lavapipe-quality
          path: |
            ommatidia/target/field-quality
            ommatidia/target/surface-smoke
            ommatidia/target/cache-regression/comparison.json
          retention-days: 7
      - name: Upload changed image
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lavapipe-image-reference
          path: ommatidia/ommatidia/tests/reference/*_actual.png
