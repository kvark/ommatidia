name: check

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Path dependencies live in sibling checkouts, so pin their exact commits
  # just as Cargo.lock pins registry and Git dependencies.
  BLADE_REV: 5c9edc354619f19fe9788fc762da984576cc722d
  MEGANEURA_REV: 3c15aae3ead66865318e69635305b6bb04d8a262

jobs:
  platform:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux/Vulkan
            os: ubuntu-latest
          - name: Windows/Vulkan
            os: windows-latest
          - name: macOS/Metal
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out Ommatidium
        uses: actions/checkout@v4
        with:
          path: ommatidia
      - name: Check out Blade
        uses: actions/checkout@v4
        with:
          repository: kvark/blade
          ref: ${{ env.BLADE_REV }}
          path: blade
      - name: Check out Meganeura
        uses: actions/checkout@v4
        with:
          repository: kvark/meganeura
          ref: ${{ env.MEGANEURA_REV }}
          path: meganeura
      - name: Install Rust
        run: rustup toolchain install 1.92.0 --profile minimal
      - name: Check workspace
        working-directory: ommatidia
        run: cargo +1.92.0 check --workspace --all-targets --locked

  check:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Ommatidium
        uses: actions/checkout@v4
        with:
          path: ommatidia
      - name: Check out Blade
        uses: actions/checkout@v4
        with:
          repository: kvark/blade
          ref: ${{ env.BLADE_REV }}
          path: blade
      - name: Check out Meganeura
        uses: actions/checkout@v4
        with:
          repository: kvark/meganeura
          ref: ${{ env.MEGANEURA_REV }}
          path: meganeura
      - name: Install Rust
        run: rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
      - name: Format
        working-directory: ommatidia
        run: cargo +1.92.0 fmt --all -- --check
      - name: Clippy
        working-directory: ommatidia
        run: cargo +1.92.0 clippy --workspace --all-targets --locked -- -D warnings
      - name: Unit tests
        working-directory: ommatidia
        run: cargo +1.92.0 test --workspace --locked
      - name: Build and run the plain-C ABI example
        working-directory: ommatidia
        run: |
          cargo +1.92.0 build --release -p ommatidia-capi --locked
          cc -std=c11 -Wall -Wextra -Werror -Iinclude examples/c/inspect.c \
            -Ltarget/release -lommatidia_native -o target/ommatidia-inspect
          LD_LIBRARY_PATH="$PWD/target/release" target/ommatidia-inspect

  lavapipe:
    name: GPU image reference (LavaPipe)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Ommatidium
        uses: actions/checkout@v4
        with:
          path: ommatidia
      - name: Check out Blade
        uses: actions/checkout@v4
        with:
          repository: kvark/blade
          ref: ${{ env.BLADE_REV }}
          path: blade
      - name: Check out Meganeura
        uses: actions/checkout@v4
        with:
          repository: kvark/meganeura
          ref: ${{ env.MEGANEURA_REV }}
          path: meganeura
      - name: Install Rust and LavaPipe
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
      - name: Run GPU contract and image tests
        working-directory: ommatidia
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
          OMMATIDIA_REQUIRE_GPU: 1
        run: cargo +1.92.0 test -p ommatidia --test gpu_runtime --locked -- --ignored --nocapture --test-threads=1
      - name: Upload changed image
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lavapipe-image-reference
          path: ommatidia/ommatidia/tests/reference/*_actual.png
