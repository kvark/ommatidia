name: geometry and noise development
on:
  pull_request:
    paths: ['.github/workflows/geometry-dev.yml', '.github/geometry-payload/**', '.github/geometry-fix.py']
permissions:
  contents: read
env:
  VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
  OMMATIDIA_REQUIRE_GPU: '1'
  RUST_BACKTRACE: '1'
jobs:
  prepare:
    if: github.event.pull_request.number == 19 && github.head_ref == 'docs/visual-quality-roadmap' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    defaults:
      run:
        shell: bash
        working-directory: ommatidia
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: ommatidia
      - uses: actions/checkout@v4
        with:
          repository: kvark/meganeura
          ref: 43b606ff45b99d23e7e57b5f120f5fc347039082
          path: meganeura
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kvark/blade
          ref: c24621aa6606da968fd1b3967d5993f8aa2b74e8
          path: blade
          persist-credentials: false
      - name: Setup and apply inspected source
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
          sudo apt-get update -qq
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
          python3 - <<'PY'
          import base64, hashlib, lzma, subprocess
          from pathlib import Path
          parts = sorted(Path('.github/geometry-payload').glob('*.txt'))
          if parts:
              assert len(parts) == 2
              data = base64.b64decode(''.join(p.read_text() for p in parts))
              assert hashlib.sha256(data).hexdigest() == '4c8355bbf27797a7279fc9f2267f42139a9ea1f212d697e39fffb2cb0b8cdab2'
              Path('/tmp/geometry.patch').write_bytes(lzma.decompress(data))
              subprocess.run(['git','apply','--check','/tmp/geometry.patch'],check=True)
              subprocess.run(['git','apply','/tmp/geometry.patch'],check=True)
          PY
          if test -f .github/geometry-fix.py; then python3 .github/geometry-fix.py; fi
          cargo +1.92.0 fmt --all
          mkdir -p target/geometry-validation
      - name: Workspace checks
        run: |
          cargo +1.92.0 check --workspace --all-targets --locked 2>&1 | tee target/geometry-validation/check.log
          cargo +1.92.0 test --workspace --locked 2>&1 | tee target/geometry-validation/unit.log
          cargo +1.92.0 clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee target/geometry-validation/clippy.log
      - name: Full software GPU contracts
        run: |
          cargo +1.92.0 test -p ommatidia --test gpu_runtime --test transport --test field --test quality_controls --test late_rgb --test candidate_oracle --test wide_field --test visibility --test projected --test consistency --locked -- --ignored --nocapture --test-threads=1 2>&1 | tee target/geometry-validation/gpu.log
          cargo +1.92.0 test -p ommatidia-data incident_capture --locked -- --ignored --nocapture --test-threads=1 2>&1 | tee target/geometry-validation/incident.log
      - name: Commit validated source only
        id: commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/docs/visual-quality-roadmap | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r --ignore-unmatch .github/geometry-payload .github/geometry-fix.py
          git add ommatidia ommatidia-data ommatidia-train benchmarks
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'feat: couple field geometry distributions and audit cross-noise selector risk'
            git push origin HEAD:refs/heads/docs/visual-quality-roadmap
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Standalone experiment binaries
        run: |
          cargo +1.92.0 build -p ommatidia-train --bin field --bin noise-risk -p ommatidia-data --bin ommatidia-data --locked
          mkdir -p target/geometry-bin
          cp target/debug/field target/debug/noise-risk target/debug/ommatidia-data target/geometry-bin/
          strip target/geometry-bin/*
      - uses: actions/upload-artifact@v4
        with:
          name: geometry-binaries
          path: ommatidia/target/geometry-bin
          retention-days: 7
      - name: Archive reviewed source and validation
        if: always()
        run: tar --exclude=.git --exclude=target -czf "$RUNNER_TEMP/geometry-source.tar.gz" . && tar -czf "$RUNNER_TEMP/geometry-tests.tar.gz" target/geometry-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geometry-source-validation
          path: |
            ${{ runner.temp }}/geometry-source.tar.gz
            ${{ runner.temp }}/geometry-tests.tar.gz
          retention-days: 7
  field:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        arm: [field-control, field-consistent]
        seed: [7, 11]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
        working-directory: ommatidia
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          path: ommatidia
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: geometry-binaries
          path: ommatidia/target/geometry-bin
      - uses: actions/download-artifact@v4
        with:
          run-id: 34153941146
          github-token: ${{ github.token }}
          name: corrected-control-data
          path: ommatidia/target/quality-control-data
      - name: Paired field training and distribution diagnostics
        env:
          ARM: ${{ matrix.arm }}
          GEOMETRY_SEED: ${{ matrix.seed }}
          GEOMETRY_UPDATES: '1024'
          GEOMETRY_FIELD_BIN: target/geometry-bin/field
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
          chmod +x target/geometry-bin/*
          (cd target/quality-control-data && sha256sum -c SHA256SUMS)
          bash benchmarks/geometry-lavapipe.sh "$ARM"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geometry-${{ matrix.arm }}-${{ matrix.seed }}
          path: ommatidia/target/geometry
          retention-days: 7
  noise:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: ommatidia
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          path: ommatidia
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kvark/blade
          ref: c24621aa6606da968fd1b3967d5993f8aa2b74e8
          path: blade
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: geometry-binaries
          path: ommatidia/target/geometry-bin
      - uses: actions/download-artifact@v4
        with:
          run-id: 34174073553
          github-token: ${{ github.token }}
          name: support-selector-control-7
          path: ommatidia/target/prior-selector
      - name: Fresh disjoint path samples and held-noise risk
        env:
          GEOMETRY_CAPTURE_BIN: target/geometry-bin/ommatidia-data
          GEOMETRY_RISK_BIN: target/geometry-bin/noise-risk
          GEOMETRY_CHECKPOINT: target/prior-selector/selector-control-7/model.safetensors
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
          chmod +x target/geometry-bin/*
          bash benchmarks/geometry-lavapipe.sh noise
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geometry-noise-risk
          path: ommatidia/target/geometry
          retention-days: 7
